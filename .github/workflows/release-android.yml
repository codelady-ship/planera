# Signed Android release (#67): an .aab for Google Play and an .apk for direct
# installs, signed with the upload keystore from GitHub Secrets (made by
# scripts/android-keystore.sh). When PLAY_SERVICE_ACCOUNT_JSON is set the
# bundle also goes to the Play internal testing track.
name: Release Android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version shown in the store, e.g. 1.0.3
        required: true
        default: "1.0.0"
      play_track:
        description: Play track to upload to (needs PLAY_SERVICE_ACCOUNT_JSON)
        type: choice
        default: internal
        options: [internal, alpha, beta, production]

jobs:
  android:
    name: Signed AAB and APK
    runs-on: ubuntu-latest
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Run scripts/android-keystore.sh and add the secrets." >&2
            exit 1
          fi
      - name: Sync the native project
        run: |
          npm ci
          npx cap sync android
      - name: Restore the upload keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.p12"
      - name: Build the signed bundle and APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: planera-release-${{ inputs.version_name }}
          path: |
            frontend/android/app/build/outputs/bundle/release/app-release.aab
            frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Upload to Google Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: az.planera.app
          releaseFiles: frontend/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track }}
          status: completed
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"
