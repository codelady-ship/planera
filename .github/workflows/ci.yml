# CI: every pull request and every push to main is checked before merge.
#   rules     - the project's no-emoji rule over every tracked file
#   frontend  - lint, type check, tests and production build (Next.js)
#   backend   - Gradle check (unit tests + Testcontainers PostgreSQL tests)
#   docker    - the backend production image builds (nothing is pushed)
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rules:
    name: Project rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No emoji in tracked files
        run: git ls-files -z | xargs -0 node scripts/check-no-emoji.mjs

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  backend:
    name: Backend (Gradle check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The runner has Docker, so the Testcontainers PostgreSQL tests run here
      # (they are skipped on machines without Docker).
      - name: Check
        run: ./gradlew check --no-daemon
      # Docker is available here, so nothing may be skipped: a skipped
      # Testcontainers test would hide a broken database layer.
      - name: No skipped tests
        run: |
          grep -ho 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*"' build/test-results/test/*.xml
          if grep -l 'skipped="[1-9]' build/test-results/test/*.xml; then
            echo "Tests were skipped although Docker is available"; exit 1
          fi
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests
          retention-days: 7

  docker:
    name: Backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t randevum-backend ./backend
