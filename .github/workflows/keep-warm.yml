# Keeps the free Render API awake (it sleeps after about 15 idle minutes, and the
# first request then takes up to a minute). Pings the public health endpoint every
# 10 minutes. GitHub may delay scheduled runs by a few minutes; the frontend also
# shows a "waking the server" notice for anything slower than 3 seconds.
name: Keep API warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /actuator/health
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://planera-api.onrender.com/actuator/health
