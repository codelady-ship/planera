# Render Blueprint (#49, #48): backend API (Docker) and Key Value (Redis).
# PostgreSQL lives on Neon (free, no expiry); its connection details are
# entered in the Render dashboard (sync: false), never committed.
services:
  - type: web
    name: randevum-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: JWT_SECRET
        generateValue: true # random secret, stays the same across deploys
      # Neon -> Connect -> direct connection (not the -pooler host):
      # jdbc:postgresql://<host>/<database>?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Web Push (#55): `npx web-push generate-vapid-keys`, keep the pair forever.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:info@randevum.az
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: randevum-redis
          property: connectionString

  - type: keyvalue
    name: randevum-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal network only
