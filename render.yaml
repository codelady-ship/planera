# Render Blueprint (#49, #48): backend API (Docker), Key Value (Redis) and
# PostgreSQL. Everything the API needs is wired here, so a new Blueprint
# deploys without typing any connection details. The one secret that must
# not live in the repository, the Web Push private key, is entered in the
# dashboard (sync: false); until then the API uses a random pair per start.
databases:
  - name: planera-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: [] # internal network only

services:
  - type: web
    name: planera-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: JWT_SECRET
        generateValue: true # random secret, stays the same across deploys
      # application.yml builds jdbc:postgresql://DB_HOST:DB_PORT/DB_NAME from these.
      # To use another PostgreSQL (e.g. Neon) set SPRING_DATASOURCE_URL in the dashboard instead.
      - key: DB_HOST
        fromDatabase:
          name: planera-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: planera-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: planera-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: planera-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: planera-db
          property: password
      # Web Push (#55): the public key is public by nature; the private half of the
      # same pair (`npx web-push generate-vapid-keys`) is set in the dashboard.
      - key: VAPID_PUBLIC_KEY
        value: BMZYiM6ja8Z8yqvyd1HyoLVCP1uPDGPvmMeNWBJ_QCPc6i4KvxCMqus7M24h06yZyYKCMn4pIJfJWq-ujb3VpcM
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:info@planera.az
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: planera-redis
          property: connectionString

  - type: keyvalue
    name: planera-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal network only
