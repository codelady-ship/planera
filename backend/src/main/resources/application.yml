spring:
  application:
    name: randevum-api
  datasource:
    # Render passes host/port/name separately (render.yaml); a full JDBC URL still wins.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:randevum}}
    username: ${SPRING_DATASOURCE_USERNAME:randevum}
    password: ${SPRING_DATASOURCE_PASSWORD:randevum}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Baku
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
