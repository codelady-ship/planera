spring:
  application:
    name: randevum-api
  datasource:
    # Production sets SPRING_DATASOURCE_URL (Neon); DB_HOST/DB_PORT/DB_NAME are local fallbacks.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:randevum}}
    username: ${SPRING_DATASOURCE_USERNAME:randevum}
    password: ${SPRING_DATASOURCE_PASSWORD:randevum}
    hikari:
      # Idle connections close after two minutes, so a serverless database
      # (Neon) can scale to zero while the API is quiet.
      minimum-idle: 0
      idle-timeout: 120000 # ms
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    # No hibernate.jdbc.time_zone: it shifts local time/date columns (working
    # hours) by the JVM offset. Instants are timestamptz and need no conversion.
    hibernate:
      ddl-auto: validate
  data:
    redis:
      # Redis is optional: when it is down the API keeps working without cache, locks and limits.
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 500ms
      connect-timeout: 500ms
  flyway:
    enabled: true
    locations: classpath:db/migration

randevum:
  jwt:
    secret: ${JWT_SECRET:} # at least 32 bytes in production; empty = random key per start
  cors:
    # Comma-separated; empty = no cross-origin browser calls (the site uses its own /api/backend gateway).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

server:
  port: ${PORT:8080}

management:
  health:
    redis:
      enabled: false # an optional dependency must not fail the health check
  endpoints:
    web:
      exposure:
        include: health
